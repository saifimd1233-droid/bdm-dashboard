<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDM Login Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2ff;
}
.container{
  max-width:1100px;
  margin:auto;
  padding:30px;
}
.card{
  background:#fff;
  padding:25px;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h1{margin:0 0 10px;color:#1e3a8a}
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:#fff;
  cursor:pointer;
  font-size:15px;
}
.secondary{background:#111827;}
.logout{
  width:auto;
  background:#dc2626;
  padding:10px 16px;
}
.msg{
  margin-top:12px;
  font-weight:bold;
}
.hidden{display:none;}
.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
iframe{
  width:100%;
  height:85vh;
  border:none;
  border-radius:12px;
  background:#fff;
}
</style>
</head>

<body>
<div class="container">

  <!-- LOGIN SECTION -->
  <div id="loginBox" class="card">
    <h1>BDM Login</h1>
    <p>Login with email/password</p>

    <input id="email" type="email" placeholder="Enter Email">
    <input id="password" type="password" placeholder="Enter Password">

    <button onclick="login()">Login</button>
    <button class="secondary" onclick="signup()">Sign Up</button>

    <div id="msg" class="msg"></div>
  </div>

  <!-- DASHBOARD SECTION -->
  <div id="dashboardBox" class="hidden">
    <div class="topbar">
      <div>
        <h1>BDM Analytics Dashboard</h1>
        <p>Created by Sohrab</p>
      </div>
      <button class="logout" onclick="logout()">Logout</button>
    </div>

    <iframe src="https://script.google.com/macros/s/AKfycbwFSgYvLv8GHhXsOgG-jgHPwZ4Kec4I9zW1_sXECHKfXYEWsh4dYCetl8r5WgSmNLXLXA/exec"></iframe>
  </div>

</div>

<script>
const SUPABASE_URL = "https://tistikdpbligsvxbgngf.supabase.co";
const SUPABASE_KEY = "sb_publishable_D4JSH1Xe_wf_iwaqpVObeA_gLcr5kWH";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(text,color="green"){
  const msg=document.getElementById("msg");
  msg.innerText=text;
  msg.style.color=color;
}

function showDashboard(){
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("dashboardBox").classList.remove("hidden");
}

function showLogin(){
  document.getElementById("dashboardBox").classList.add("hidden");
  document.getElementById("loginBox").classList.remove("hidden");
}

async function signup(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!email || !password){
    return showMsg("Enter email and password","red");
  }

  const {error}=await client.auth.signUp({
    email,
    password
  });

  if(error) return showMsg(error.message,"red");

  showMsg("Signup successful! Now login.");
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!email || !password){
    return showMsg("Enter email and password","red");
  }

  const {error}=await client.auth.signInWithPassword({
    email,
    password
  });

  if(error) return showMsg(error.message,"red");

  showDashboard();
}

async function logout(){
  await client.auth.signOut();
  showLogin();
}

window.onload = async ()=>{
  const {data}=await client.auth.getSession();
  if(data.session){
    showDashboard();
  }else{
    showLogin();
  }
}
</script>
</body>
</html>
