<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDM Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2ff;
}
.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  background:#fff;
  width:100%;
  max-width:430px;
  padding:28px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h1{
  margin:0 0 8px;
  color:#1e3a8a;
}
p{
  color:#666;
  margin:0 0 18px;
}
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #d1d5db;
  border-radius:10px;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}
.primary{
  background:#2563eb;
  color:#fff;
}
.dark{
  background:#111827;
  color:#fff;
}
.msg{
  margin-top:12px;
  text-align:center;
  font-size:14px;
  color:green;
}
.err{
  color:red;
}
</style>
</head>

<body>
<div class="wrap">
  <div class="card">
    <h1>BDM Login</h1>
    <p>Login / Sign Up with Gmail</p>

    <input type="email" id="email" placeholder="Enter Gmail">
    <input type="password" id="password" placeholder="Enter Password">

    <button class="primary" onclick="loginUser()">Login</button>
    <button class="dark" onclick="signupUser()">Sign Up</button>

    <div id="msg" class="msg"></div>
  </div>
</div>

<script>
const supabaseUrl = "PASTE_YOUR_SUPABASE_URL_HERE";
const supabaseKey = "PASTE_YOUR_ANON_KEY_HERE";

const client = supabase.createClient(supabaseUrl, supabaseKey);

function showMsg(text, error=false){
  const box = document.getElementById("msg");
  box.innerText = text;
  box.className = error ? "msg err" : "msg";
}

async function signupUser(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    showMsg("Enter email and password", true);
    return;
  }

  const { error } = await client.auth.signUp({
    email: email,
    password: password
  });

  if(error){
    showMsg(error.message, true);
  }else{
    showMsg("Signup success! Check Gmail to verify.");
  }
}

async function loginUser(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  const { data, error } = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    showMsg(error.message, true);
  }else{
    showMsg("Login successful!");
    setTimeout(()=>{
      window.location.href="https://google.com";
    },1000);
  }
}
</script>
</body>
</html>
