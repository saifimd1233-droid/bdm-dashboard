<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDM Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2ff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.card{
  background:#fff;
  width:380px;
  padding:28px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h1{margin:0 0 8px;color:#1e3a8a;}
p{color:#666;margin-bottom:14px;}
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  color:#fff;
  background:#2563eb;
  cursor:pointer;
  font-size:15px;
}
.signup{background:#111827;}
.msg{margin-top:12px;font-weight:bold;}
</style>
</head>

<body>
<div class="card">
  <h1>BDM Login</h1>
  <p>Created by Sohrab</p>

  <input id="email" type="email" placeholder="Enter Email">
  <input id="password" type="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>
  <button class="signup" onclick="signup()">Sign Up</button>

  <div id="msg" class="msg"></div>
</div>

<script>
const SUPABASE_URL = "https://tistikdpbligsvxbgngf.supabase.co";
const SUPABASE_KEY = "sb_publishable_D4JSH1Xe_wf_iwaqpVObeA_gLcr5kWH";
const DASHBOARD_URL = "https://script.google.com/macros/s/AKfycbwFSgYvLv8GHhXsOgG-jgHPwZ4Kec4I9zW1_sXECHKfXYEWsh4dYCetl8r5WgSmNLXLXA/exec";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showMsg(text,color="green"){
  const msg=document.getElementById("msg");
  msg.innerText=text;
  msg.style.color=color;
}

async function signup(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!email || !password){
    return showMsg("Enter email and password","red");
  }

  const {error}=await client.auth.signUp({
    email,
    password
  });

  if(error) return showMsg(error.message,"red");

  showMsg("Signup successful! Now login.");
}

async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value.trim();

  if(!email || !password){
    return showMsg("Enter email and password","red");
  }

  const {error}=await client.auth.signInWithPassword({
    email,
    password
  });

  if(error) return showMsg(error.message,"red");

  showMsg("Login successful!");

  setTimeout(()=>{
    window.open(DASHBOARD_URL,"_blank");
  },500);
}

window.onload = async ()=>{
  const {data}=await client.auth.getSession();
  if(data.session){
    showMsg("Already logged in!");
  }
}
</script>
</body>
</html>
