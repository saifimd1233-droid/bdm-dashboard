<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BDM Secure Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Arial,sans-serif;
  background:#eef2ff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}
.card{
  background:#fff;
  width:390px;
  max-width:100%;
  padding:28px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h1{
  color:#1e3a8a;
  margin-bottom:8px;
  font-size:38px;
}
.sub{
  color:#666;
  margin-bottom:16px;
}
input{
  width:100%;
  padding:13px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
button{
  width:100%;
  padding:13px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
  color:#fff;
  background:#2563eb;
}
.signup{
  background:#111827;
}
.msg{
  margin-top:14px;
  font-size:14px;
  font-weight:bold;
}
.footer{
  margin-top:18px;
  text-align:center;
  color:#777;
  font-size:13px;
}
</style>
</head>

<body>

<div class="card">
  <h1>BDM Login</h1>
  <div class="sub">Login or create account</div>

  <input id="email" type="email" placeholder="Enter Email">
  <input id="password" type="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>
  <button class="signup" onclick="signup()">Sign Up</button>

  <div id="msg" class="msg"></div>

  <div class="footer">Designed by Sohrab Alam</div>
</div>

<script>
const SUPABASE_URL = "https://tistikdpbligsvxbgngf.supabase.co";
const SUPABASE_KEY = "sb_publishable_D4JSH1Xe_wf_iwaqpVObeA_gLcr5kWH";

const DASHBOARD_URL = "https://script.google.com/macros/s/AKfycbwFSgYvLv8GHhXsOgG-jgHPwZ4Kec4I9zW1_sXECHKfXYEWsh4dYCetl8r5WgSmNLXLXA/exec";

const OWNER_EMAIL = "sohrab.alam@houseofedtech.in";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function show(text,color="green"){
  const msg = document.getElementById("msg");
  msg.innerText = text;
  msg.style.color = color;
}

async function signup(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    return show("Enter email and password","red");
  }

  const { error } = await client.auth.signUp({
    email,
    password
  });

  if(error){
    return show(error.message,"red");
  }

  show("Signup successful! Now login.");
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    return show("Enter email and password","red");
  }

  const { error } = await client.auth.signInWithPassword({
    email,
    password
  });

  if(error){
    return show(error.message,"red");
  }

  show("Login successful! Redirecting...");

  setTimeout(()=>{
    window.location.href = DASHBOARD_URL + "?user=" + encodeURIComponent(email);
  },1000);
}

window.onload = async () => {
  const { data } = await client.auth.getSession();

  if(data.session){
    const userEmail = data.session.user.email;

    if(userEmail === OWNER_EMAIL){
      window.location.href = DASHBOARD_URL;
    }else{
      window.location.href = DASHBOARD_URL + "?user=" + encodeURIComponent(userEmail);
    }
  }
}
</script>

</body>
</html>
