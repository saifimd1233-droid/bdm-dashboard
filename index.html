<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BDM Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#eef2ff;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}
.card{
  background:#fff;
  width:380px;
  padding:28px;
  border-radius:18px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
h1{
  margin:0 0 8px;
  color:#1e3a8a;
}
.sub{
  color:#666;
  margin-bottom:14px;
}
input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  box-sizing:border-box;
}
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  font-size:15px;
  cursor:pointer;
  color:#fff;
  background:#2563eb;
}
.signup{
  background:#111827;
}
.msg{
  margin-top:14px;
  font-size:14px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="card">
  <h1>BDM Login</h1>
  <div class="sub">Login with email/password</div>

  <input id="email" type="email" placeholder="Enter Email">
  <input id="password" type="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>
  <button class="signup" onclick="signup()">Sign Up</button>

  <div id="msg" class="msg"></div>
</div>

<script>
const SUPABASE_URL = "https://tistikdpbligsvxbgngf.supabase.co";
const SUPABASE_KEY = "sb_publishable_D4JSH1Xe_wf_iwaqpVObeA_gLcr5kWH";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function show(text,color="green"){
  const msg = document.getElementById("msg");
  msg.innerText = text;
  msg.style.color = color;
}

async function signup(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    return show("Enter email and password","red");
  }

  const { error } = await client.auth.signUp({
    email: email,
    password: password,
    options:{
      emailRedirectTo:"https://saifimd1233-droid.github.io/bdm-dashboard/"
    }
  });

  if(error){
    return show(error.message,"red");
  }

  show("Signup successful! Check email.");
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!email || !password){
    return show("Enter email and password","red");
  }

  const { error } = await client.auth.signInWithPassword({
    email: email,
    password: password
  });

  if(error){
    return show(error.message,"red");
  }

  show("Login successful! Redirecting...");

  setTimeout(() => {
    window.location.href =
    "https://script.google.com/macros/s/AKfycbwFSgYvLv8GHhXsOgG-jgHPwZ4Kec4I9zW1_sXECHKfXYEWsh4dYCetl8r5WgSmNLXLXA/exec";
  }, 1000);
}

window.onload = async () => {
  const { data } = await client.auth.getSession();
  if(data.session){
    window.location.href =
    "https://script.google.com/macros/s/AKfycbwFSgYvLv8GHhXsOgG-jgHPwZ4Kec4I9zW1_sXECHKfXYEWsh4dYCetl8r5WgSmNLXLXA/exec";
  }
};
</script>

</body>
</html>
